# Local stack for development and testing: builds the images from this repo.
# Production runs from the infra repo (btc/compose.yml), which pulls the same
# images from ghcr.io and adds the reverse proxy.
#
#   docker compose up -d --build
#   docker compose logs -f
#
# Logs in a browser: http://localhost:8080 (dozzle, localhost-only).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  quant2:
    build:
      context: .
      target: collector
    image: btc-collector:local
    # Owner of the files in ./data. Set APP_UID / APP_GID in .env to match your
    # user (`id -u`, `id -g`) if you are not 1000:1000.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    # ASSETS / MARKETS / BINANCE_MARKETS (optional; defaults in src/config.rs) come from .env.
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging: *logging

  uploader:
    build:
      context: .
      target: uploader
    image: btc-uploader:local
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      RUST_LOG: ${RUST_LOG:-uploader=info}
      # AWS SDK reads the key/secret from this file (mounted via the secret below)
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/s3_credentials
    secrets:
      - s3_credentials
    volumes:
      # read-write: the uploader also prunes old local files (RETENTION_DAYS)
      - ./data:/app/data
    logging: *logging

  # Log watcher. Reads quant2 + uploader logs via the Docker socket (read-only)
  # and sends a Telegram alert on WARN/ERROR lines, a stalled collector or a
  # stalled uploader. See .env.example.
  logwatch:
    build:
      context: .
      target: logwatch
    image: btc-logwatch:local
    # The Docker socket is root:docker 0660. Socket access is root-equivalent
    # anyway, so running this read-only log reader as root grants nothing
    # extra. It writes no files.
    user: "0:0"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Diagnostics: set LOGWATCH_LOG=logwatch=debug (or =trace to see every raw
      # log line logwatch ingests) in .env, then `docker compose up -d logwatch`.
      RUST_LOG: ${LOGWATCH_LOG:-logwatch=info}
      COLLECTOR_SERVICE: quant2
      UPLOADER_SERVICE: uploader
      # Free-space alert: the data dir is mounted read-only below.
      DISK_PATHS: /app/data
      # NOTE: all other tunables (incl. UPLOADER_MAX_SILENCE_SECS — keep it well
      # above UPLOAD_INTERVAL_SECS) come from .env via env_file above. Do not
      # hardcode them here: values in `environment:` override `.env`.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/app/data:ro
    logging: *logging

  dozzle:
    image: amir20/dozzle:v11.4.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    logging: *logging

secrets:
  s3_credentials:
    file: ./secrets/s3_credentials
