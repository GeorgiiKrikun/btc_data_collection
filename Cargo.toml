[package]
name = "quant_2"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
chrono = "0.4"
futures-util = "0.3"
csv = "1"
anyhow = "1"
rust_decimal = "1"
crc32fast = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
# logwatch: Docker log streaming over the unix socket (no TLS needed) + a
# ring-backed HTTPS client for Telegram / healthchecks (no aws-lc / cmake).
bollard = { version = "0.17", default-features = false }
ureq = { version = "2", features = ["json"] }

[[bin]]
name = "quant_2"
path = "src/main.rs"

[[bin]]
name = "uploader"
path = "src/bin/uploader.rs"

[[bin]]
name = "logwatch"
path = "src/bin/logwatch.rs"
